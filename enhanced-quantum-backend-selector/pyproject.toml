[project]
name = "enhanced-quantum-backend-selector"
version = "0.1.0"
description = ""
authors = [
    {name = "sevetseh28",email = "hernaner28@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qiskit (>=2.2.3,<3.0.0)",
    "qiskit-aer (>=0.17.2,<0.18.0)",
    "qiskit-ibm-runtime (>=0.43.1,<0.44.0)",
    "graphviz (>=0.21,<0.22)",
    "jupyter (>=1.1.1,<2.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
]

[tool.poetry]
packages = [{include = "enhanced_quantum_backend_selector", from = "src"}]


[tool.poetry.group.dev.dependencies]
mypy = "^1.18.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
