name: Publish to PyPI

on:
  release:
    types: [ published ]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      test-pypi:
        description: 'Publish to TestPyPI instead of PyPI'
        required: false
        default: 'true'

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.event.inputs.test-pypi == 'true' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for poetry-dynamic-versioning

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: |
          cd enhanced-quantum-backend-selector
          poetry install

      - name: Run tests
        run: |
          cd enhanced-quantum-backend-selector
          poetry run pytest --cov=enhanced_quantum_backend_selector --cov-fail-under=80

      - name: Build package
        run: |
          cd enhanced-quantum-backend-selector
          poetry build

      - name: Verify package metadata
        run: |
          cd enhanced-quantum-backend-selector
          poetry run twine check dist/*

      - name: Publish to TestPyPI
        if: github.event.inputs.test-pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: enhanced-quantum-backend-selector/dist/
          verbose: true

      - name: Publish to PyPI
        if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: enhanced-quantum-backend-selector/dist/
          verbose: true

      - name: Upload release artifacts
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: enhanced-quantum-backend-selector/dist/
          retention-days: 90
