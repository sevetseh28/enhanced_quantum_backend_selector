name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-matrix:
    name: Python ${{ matrix.python-version }} / Qiskit ${{ matrix.qiskit }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        qiskit: ["minimum", "latest"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        working-directory: enhanced-quantum-backend-selector
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.qiskit }}" = "minimum" ]; then
            # Keep in sync with the lower bound of the qiskit dependency in pyproject.toml.
            # Resolved together so test dependencies are downgraded to versions that support it.
            pip install -e ".[dev]" "qiskit==2.2.3"
          else
            pip install -e ".[dev]"
          fi
          pip list | grep -i qiskit

      - name: Run tests
        working-directory: enhanced-quantum-backend-selector
        run: pytest

  test:
    name: Test in Dev Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run in dev container
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/sevetseh28/enhanced-quantum-backend-selector-devcontainer
          cacheFrom: ghcr.io/sevetseh28/enhanced-quantum-backend-selector-devcontainer
          runCmd: |
            cd enhanced-quantum-backend-selector
            poetry install --with dev
            poetry run ruff check .
            poetry run ruff format --check .
            poetry run mypy src/
            poetry run pytest --cov=enhanced_quantum_backend_selector --cov-report=xml --cov-report=term-missing --cov-fail-under=80
            poetry run python examples/validate_examples.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./enhanced-quantum-backend-selector/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build package in Dev Container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build in dev container
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/sevetseh28/enhanced-quantum-backend-selector-devcontainer
          cacheFrom: ghcr.io/sevetseh28/enhanced-quantum-backend-selector-devcontainer
          runCmd: |
            cd enhanced-quantum-backend-selector
            poetry build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: enhanced-quantum-backend-selector/dist/
          retention-days: 7
