name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test in Dev Container
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and run in dev container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            cd enhanced-quantum-backend-selector
            poetry install --with dev
            poetry run ruff check .
            poetry run ruff format --check .
            poetry run mypy src/
            poetry run pytest --cov=enhanced_quantum_backend_selector --cov-report=xml --cov-report=term-missing --cov-fail-under=80
            poetry run python examples/validate_examples.py
          env: |
            PYTHON_VERSION=${{ matrix.python-version }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          file: ./enhanced-quantum-backend-selector/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build package in Dev Container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build in dev container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            cd enhanced-quantum-backend-selector
            poetry build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: enhanced-quantum-backend-selector/dist/
          retention-days: 7
