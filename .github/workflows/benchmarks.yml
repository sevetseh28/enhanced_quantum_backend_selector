name: Benchmarks

on:
  workflow_dispatch:  # Allow manual trigger
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at 00:00 UTC
  push:
    branches: [ main ]
    paths:
      - 'enhanced-quantum-backend-selector/benchmarks/**'
      - 'enhanced-quantum-backend-selector/src/**'
      - '.github/workflows/benchmarks.yml'

jobs:
  run-benchmarks:
    name: Run Benchmark Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached dependencies
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: enhanced-quantum-backend-selector/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        working-directory: enhanced-quantum-backend-selector
        run: poetry install --with dev

      - name: Run benchmark suite
        working-directory: enhanced-quantum-backend-selector
        run: |
          mkdir -p benchmark_results
          poetry run python benchmarks/run_benchmarks.py --output benchmark_results

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_number }}
          path: enhanced-quantum-backend-selector/benchmark_results/*.json
          retention-days: 90

      - name: Display benchmark summary
        working-directory: enhanced-quantum-backend-selector
        run: |
          echo "## Benchmark Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Benchmark run completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Files generated:**" >> $GITHUB_STEP_SUMMARY
          ls -lh benchmark_results/*.json >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Results have been uploaded as artifacts and will be retained for 90 days." >> $GITHUB_STEP_SUMMARY
