name: Test Release (Dry Run)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  test-release:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-reusable.yml
    with:
      dry_run: true
    secrets: inherit
