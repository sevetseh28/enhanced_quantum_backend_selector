name: Manual Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual release)'
        type: boolean
        required: false
        default: false

jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      packages: write
    uses: ./.github/workflows/release-reusable.yml
    with:
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

