name: Manual Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual release)'
        type: boolean
        required: false
        default: false

jobs:
  release:
    name: ${{ inputs.dry_run && 'Test Release (Dry Run)' || 'Create Release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run release in dev container
        uses: devcontainers/ci@v0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          imageName: ghcr.io/sevetseh28/enhanced-quantum-backend-selector-devcontainer
          cacheFrom: ghcr.io/sevetseh28/enhanced-quantum-backend-selector-devcontainer
          env: |
            GH_TOKEN
          runCmd: |
            cd enhanced-quantum-backend-selector
            poetry install

            # Configure git for commits
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git config --global --add safe.directory /workspaces/enhanced_quantum_backend_selector

            # Run semantic release
            # Note: --noop must come BEFORE the subcommand
            # version command by default: commits, tags, pushes, updates changelog, creates VCS release
            # publish command: uploads dist artifacts to the VCS release
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              poetry run semantic-release -v --noop version
            else
              poetry run semantic-release -v version
              poetry run semantic-release -v publish
            fi
