name: Automated Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test and build in dev container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            cd enhanced-quantum-backend-selector
            poetry install
            poetry run pytest --cov=enhanced_quantum_backend_selector --cov-fail-under=80
            poetry build

      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v9.17.0
        with:
          directory: enhanced-quantum-backend-selector
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions[bot]
          git_committer_email: github-actions[bot]@users.noreply.github.com
