name: Publish to PyPI

on:
  release:
    types: [ published ]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      test-pypi:
        description: 'Publish to TestPyPI instead of PyPI'
        required: false
        default: 'true'

permissions:
  packages: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.event.inputs.test-pypi == 'true' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build in dev container
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/sevetseh28/enhanced-quantum-backend-selector-devcontainer
          cacheFrom: ghcr.io/sevetseh28/enhanced-quantum-backend-selector-devcontainer
          runCmd: |
            cd enhanced-quantum-backend-selector
            poetry install --only main
            poetry build

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test-pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: enhanced-quantum-backend-selector/dist/
          verbose: true

      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.test-pypi == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: enhanced-quantum-backend-selector/dist/
          verbose: true
