name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal example
      description: Code that reproduces the problem, ideally using fake backends.
      render: python
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `pip list | grep -i -E "qiskit|enhanced"` and your Python version.
      render: text
    validations:
      required: true
